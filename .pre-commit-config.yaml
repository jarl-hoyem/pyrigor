#file: noinspection YAMLSchemaValidation
# Keeping repository quality high.
default_install_hook_types: [ pre-commit, commit-msg ]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements  # Check for debugger imports and breakpoint() in python files.
      - id: check-ast  # Check whether files parse as valid python.
      - id: fix-byte-order-marker  # Removes UTF-8 byte order marker.
      - id: check-json
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict  # Check filenames for conflicts in case-insensitive filesystem: macOS HFS+, Windows FAT
      - id: end-of-file-fixer  # Makes sure files end in a newline and only a newline.
      - id: trailing-whitespace
      - id: mixed-line-ending
  - repo: https://github.com/pycqa/pylint
    rev: v4.0.7
    hooks:
      - id: pylint
        additional_dependencies: [ "pytest" ]  # add pyrigor's runtime deps here as they're introduced
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.1
    hooks:
      - id: commitizen
        stages: [ commit-msg ]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [ "-c", "pyproject.toml" ]
        additional_dependencies: [ "bandit[toml]" ]
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: [ "pyrigor", "scripts" ]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v7.0.1
    hooks:
      - id: complexipy
        entry: python scripts/run_complexipy.py
        # 6 reflects this project's own real, measured maximum
        # complexity ('walk_once', the single hardest case, exempted
        # inline via `# complexipy: ignore`). If a new function
        # exceeds this, prefer a refactoring, or a scoped, justified
        # inline ignore statement over raising this number globally.
        args: [ "--max-complexity-allowed", "6" ]
  - repo: https://github.com/jarl-hoyem/pyrigor
    rev: v0.7.1
    hooks:
      - id: pyrigor
        exclude: ^tests/
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        entry: uv run --extra dev pyright
        args:
          - --project=pyproject.toml
        pass_filenames: false
      - id: ty
        name: ty
        language: system
        entry: uv run --extra dev ty
        args:
          - check
          - .
        pass_filenames: false
      - id: mypy
        name: mypy
        language: system
        entry: uv run --extra dev mypy
        args:
          - .
        pass_filenames: false
      - id: xenon
        name: xenon
        language: python
        entry: xenon
        pass_filenames: false
        types: [ python ]
        additional_dependencies: [ "xenon==0.9.3" ]
        args:
          - --max-absolute=A
          - --max-modules=A
          - --max-average=A
          - pyrigor/
      - id: radon-maintainability
        name: radon maintainability
        entry: radon mi
        language: python
        types: [ python ]
        args: [ "--min", "A", "--exclude", "tests/", "pyrigor" ]
        additional_dependencies: [ "radon==6.0.1" ]
        pass_filenames: false
      - id: uv-lock-check
        name: uv lock check
        language: python
        entry: uv lock --check
        pass_filenames: false
      - id: pyrigor
        name: pyrigor (WIP self-check, uncommitted code)
        language: system
        entry: uv run --extra dev python -m pyrigor.checkers.cli pyrigor
        types: [ python ]
        exclude: ^tests/
        pass_filenames: false
      - id: pytest
        name: pytest
        language: system
        entry: uv run --extra dev pytest
        pass_filenames: false
        # Saved for later: stages: [pre-push] # Only run on push instead of every commit.
      - id: dod-check
        name: DoD - warn on likely missed doc/changelog updates
        language: system
        entry: uv run --extra dev python scripts/check_definition_of_done.py
        pass_filenames: false
        always_run: true
      - id: version-sync
        name: sync hook versions and uv.lock on a version bump
        language: system
        entry: uv run --extra dev python scripts/version_sync.py
        pass_filenames: false
        always_run: true
