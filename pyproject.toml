[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrigor"
version = "0.7.2"
description = "A Python coding discipline guideline collection and (eventually) linter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jarl Hoyem (@jarl-hoyem)" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
pyrigor = "pyrigor.checkers.cli:run"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=6.3.0",
  "mypy>=2.3.0",
  "pyright>=1.1.411",
  "ty>=0.0.71",
  "ruff>=0.16.3",
  "mutmut>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrigor*"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = [
  "-m", "not slow",
  "--cov=pyrigor",
  "--cov-branch",
  "--cov-report=html",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
  "--strict-markers",
  "-W", "error",
]

[tool.coverage.run]
source = ["pyrigor"]

[tool.pydocstyle]
convention = "google"

[tool.mutmut]
source_paths = "pyrigor/"

[tool.pylint.format]
max-line-length = 120

[tool.bandit]

[tool.bandit.assert_used]
skips = ["*tests/*"]

[tool.codespell]
# astroid: a real Python library name (pylint's inference engine), not a typo for "asteroid"
ignore-words-list = "astroid"
