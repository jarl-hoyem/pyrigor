#file: noinspection YAMLSchemaValidation
# Keeping repository quality high.
default_install_hook_types: [ pre-commit, commit-msg ]
repos:
  # The version-sync runs first, deliberately split out of the larger
  # local block below: if a version bump forces an immediate
  # re-commit, better to know before spending time on everything
  # else. The local blocks are safe to repeat. No version/URL pinning
  # is involved, unlike splitting a real remote repo entry would be.
  - repo: local
    hooks:
      - id: version-sync
        name: sync hook versions and uv.lock on a version bump
        language: system
        entry: uv run --extra dev python scripts/version_sync.py
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Auto-fixers first: everything after validates their
      # already-fixed output, not a stale version.
      - id: fix-byte-order-marker  # Removes UTF-8 byte order marker.
        stages: [ pre-commit ]
      - id: trailing-whitespace
        stages: [ pre-commit ]
      - id: end-of-file-fixer  # Makes sure files end in a newline and only a newline.
        stages: [ pre-commit ]
      - id: mixed-line-ending
        stages: [ pre-commit ]
      # Fast, basic file hygiene checks.
      - id: check-toml
        stages: [ pre-commit ]
      - id: check-yaml
        stages: [ pre-commit ]
      - id: check-json
        stages: [ pre-commit ]
      - id: check-ast  # Check whether files parse as valid python.
        stages: [ pre-commit ]
      - id: debug-statements  # Check for debugger imports and breakpoint() in python files.
        stages: [ pre-commit ]
      - id: detect-private-key
        stages: [ pre-commit ]
      - id: check-shebang-scripts-are-executable
        stages: [ pre-commit ]
      - id: check-added-large-files
        stages: [ pre-commit ]
      - id: check-case-conflict  # Check filenames for conflicts in case-insensitive filesystem: macOS HFS+, Windows FAT
        stages: [ pre-commit ]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        stages: [ pre-commit ]
      - id: ruff-format
        stages: [ pre-commit ]
  # Security.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [ pre-commit ]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [ pre-commit ]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [ "-c", "pyproject.toml" ]
        additional_dependencies: [ "bandit[toml]" ]
        stages: [ pre-commit ]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [ commit-msg ]
  # Complexity/quality.
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        # Default confidence (60) kept deliberately: two real runs
        # against pyrigor/, scripts/, and tests/ produced zero false
        # positives at this threshold, no evidence raising it would help.
        args: [ "pyrigor", "scripts", "tests" ]
        stages: [ pre-commit ]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        stages: [ pre-commit ]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        stages: [ pre-commit ]
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v7.0.1
    hooks:
      - id: complexipy
        entry: python scripts/run_complexipy.py
        # 6 reflects this project's own real, measured maximum
        # complexity ('walk_once', the single hardest case, exempted
        # inline via `# complexipy: ignore`). If a new function
        # exceeds this, prefer a refactoring, or a scoped, justified
        # inline ignore statement over raising this number globally.
        args: [ "--max-complexity-allowed", "6", "--failed" ]
        stages: [ pre-commit ]
  # Project-specific.
  - repo: https://github.com/jarl-hoyem/pyrigor
    # The published self-hosted hook intentionally lags until the next release
    # is completed. That lag is accepted, so the pinned hook always references
    # an existing released tag. Update this pin after each release.
    rev: v0.11.0
    hooks:
      - id: pyrigor
        args: [ --exclude, manual-tests ]
        stages: [ pre-commit ]
  # Tools that need the project's own real dependencies installed to
  # work correctly (resolving imports, checking types against actual
  # third-party packages) run here. They run via the project's own uv-managed
  # dev environment, rather than an isolated pre-commit environment
  # with no access to pyrigor's own dependencies. Their real version
  # lives in pyproject.toml's dev extras, a single source of truth, not
  # a separate rev: pin the way every tool above this point uses.
  - repo: local
    hooks:
      # Type/correctness checkers, fastest first.
      - id: ty
        name: ty
        language: system
        entry: uv run --extra dev ty
        args:
          - check
          - .
        pass_filenames: false
        stages: [ pre-commit ]
      - id: mypy
        name: mypy
        language: system
        entry: uv run --extra dev mypy
        args:
          - .
        pass_filenames: false
        stages: [ pre-commit ]
      - id: pyright
        name: pyright
        language: system
        entry: uv run --extra dev pyright
        args:
          - --project=pyproject.toml
        pass_filenames: false
        stages: [ pre-commit ]
      - id: pylint
        name: pylint
        language: system
        entry: uv run --extra dev pylint
        types: [ python ]
        stages: [ pre-commit ]
      # More complexity/quality, fastest first.
      - id: radon-maintainability
        name: radon maintainability
        entry: radon mi
        language: python
        types: [ python ]
        args: [ "--min", "A", "pyrigor", "tests" ]
        additional_dependencies: [ "radon==6.0.1" ]
        pass_filenames: false
        stages: [ pre-commit ]
      - id: xenon-shared
        name: xenon (relaxed to B, for files with a documented exception)
        language: python
        entry: xenon
        pass_filenames: false
        types: [ python ]
        additional_dependencies: [ "xenon==0.9.3" ]
        # Each file listed here needs its own DECISIONS.md-documented
        # reason, the same way _shared.py's walk_once does
        # (single-pass node classification is the point — the same
        # reason it already carries a `# complexipy: ignore`). The tool xenon
        # has no per-function suppression, so relaxing the threshold
        # is scoped to specific files via a second invocation, not a
        # global threshold change.
        args:
          - --max-absolute=B
          - --max-modules=A
          - --max-average=A
          - pyrigor/checkers/_shared.py
          # Add a new file's own path here, and its matching
          # `*filename.py` glob to the strict hook's --exclude above.
        stages: [ pre-commit ]
      - id: xenon
        name: xenon
        language: python
        entry: xenon
        pass_filenames: false
        types: [ python ]
        additional_dependencies: [ "xenon==0.9.3" ]
        # Files relaxed to level B below are excluded here, one glob
        # per comma-separated entry. Adding a new relaxed file means
        # extending this list and xenon-shared's own path list below
        # — not redesigning the mechanism.
        args:
          - --max-absolute=A
          - --max-modules=A
          - --max-average=A
          - --exclude=*_shared.py
          - pyrigor/
          - scripts/
          - tests/
        stages: [ pre-commit ]
      - id: tach
        name: tach (module-boundary enforcement)
        entry: tach check
        language: python
        additional_dependencies: [ "tach==0.35.0" ]
        files: (\.py$|tach\.toml$)
        pass_filenames: false
        stages: [ pre-commit ]
      # Project-specific.
      - id: uv-lock-check
        name: uv lock check
        language: python
        entry: uv lock --check
        pass_filenames: false
        stages: [ pre-commit ]
      - id: dod-check
        name: DoD - warn on likely missed doc/changelog updates
        language: system
        entry: uv run --extra dev python scripts/check_definition_of_done.py
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]
      - id: generate-rule-table
        name: regenerate guidelines/RULES.md from the real guideline docs
        language: system
        entry: uv run --extra dev python scripts/generate_rule_table.py
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]
      - id: pyrigor
        name: pyrigor (WIP self-check, uncommitted code)
        language: system
        entry: uv run --extra dev python -m pyrigor.checkers.cli . --exclude manual-tests
        types: [ python ]
        pass_filenames: false
        stages: [ pre-commit ]
      # Tests.
      - id: pytest
        name: pytest
        language: system
        entry: uv run --extra dev pytest
        pass_filenames: false
        stages: [ pre-commit ]
      # Dependency audits, slowest, external concern, last.
      - id: pip-audit
        name: pip-audit (fast, local environment)
        language: system
        entry: uv run --extra dev --with pip-audit pip-audit --local
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]
      - id: pip-audit-locked
        name: pip-audit (precise, exact uv.lock versions, pre-push/CI only)
        language: system
        entry: uv run --with pip-audit python scripts/run_pip_audit.py
        pass_filenames: false
        always_run: true
        stages: [ pre-push ]
