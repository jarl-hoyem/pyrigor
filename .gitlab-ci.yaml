stages: [check, verify]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: "$CI_COMMIT_BRANCH"

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/venv/.cache/uv"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/venv/.cache/pre-commit"

default:
  image: ghcr.io/astral-sh/uv:0.12.23-python3.14-trixie-slim
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git nodejs npm
    - uv pip install --system pre-commit==4.6.2 rust-just==1.58.0
    - npm ci
    - uv lock --check
    - uv sync --locked --extra dev
  cache:
    key:
      prefix: "$CI_JOB_NAME"
      files: [uv.lock, .pre-commit-config.yaml]
    paths: [venv/.cache/uv/, venv/.cache/pre-commit/]
  after_script:
    - uv cache prune --ci

quality:
  stage: check
  timeout: 35 minutes
  variables:
    # The secret-scan job runs the current-tree scan on a clean checkout.
    SKIP: gitleaks-tree
  script:
    - just check
    - just check manual

secret-scan:
  stage: check
  timeout: 15 minutes
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
    - uv pip install --system pre-commit==4.6.2
  script:
    - pre-commit run gitleaks-tree --all-files --hook-stage manual

tests:
  stage: check
  timeout: 35 minutes
  variables:
    PYTEST_ADDOPTS: "--junitxml=junit.xml --cov-report=xml"
  script:
    - just check pre-push
  artifacts:
    when: always
    expire_in: 1 week
    paths: [htmlcov/]
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: check
  timeout: 10 minutes
  script:
    - uv build
  artifacts:
    expire_in: 1 week
    paths: [dist/*.whl, dist/*.tar.gz]

artifact-smoke:
  stage: verify
  timeout: 10 minutes
  needs:
    - job: quality
      artifacts: false
    - job: tests
      artifacts: false
    - job: build
      artifacts: true
  script:
    - uv run python scripts/smoke_test_artifacts.py --no-build
