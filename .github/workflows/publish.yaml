# This workflow uploads a Python Package to PyPI when a release is created.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# This workflow uses actions not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Upload Python Package
on:
  release:
    types: [ published ]
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build release distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
  large-repo-smoke-test:
    runs-on: ubuntu-latest
    needs:
      - release-build
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Clone a large external repo
        run: git clone --depth 1 https://github.com/home-assistant/core.git /tmp/core
      - name: Install project
        run: uv sync --extra dev
      - name: Run pyrigor against it, must not crash
        run: uv run pyrigor /tmp/core
  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
      - large-repo-smoke-test
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/pyrigor/${{ github.event.release.name }}
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
