#file: noinspection YAMLSchemaValidation
# Keeping repository quality high.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  # The version-sync runs first, deliberately split out of the larger
  # local block below: if a version bump forces an immediate
  # re-commit, better to know before spending time on everything
  # else. The local blocks are safe to repeat. No version/URL pinning
  # is involved, unlike splitting a real remote repo entry would be.
  - repo: local
    hooks:
      - id: version-sync
        name: sync hook versions and uv.lock on a version bump
        language: system
        entry: uv run --extra dev python scripts/version_sync.py
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  - repo: local
    hooks:
      # Auto-fixers first: everything after validates their
      # already-fixed output, not a stale version.
      - id: fix-byte-order-marker # Removes UTF-8 byte order marker.
        name: fix utf-8 byte order marker
        entry: uv run --extra dev fix-byte-order-marker
        language: system
        types: [text]
        stages: [pre-commit]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --extra dev trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit]
      - id: end-of-file-fixer # Makes sure files end in a newline and only a newline.
        name: fix end of files
        entry: uv run --extra dev end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit]
      - id: mixed-line-ending
        name: mixed line ending
        entry: uv run --extra dev mixed-line-ending
        language: system
        types: [text]
        stages: [pre-commit]
      # Fast, basic file hygiene checks.
      - id: check-toml
        name: check toml
        entry: uv run --extra dev check-toml
        language: system
        types: [toml]
        stages: [pre-commit]
      - id: check-yaml
        name: check yaml
        entry: uv run --extra dev check-yaml
        language: system
        types: [yaml]
        stages: [pre-commit]
      - id: check-json
        name: check json
        entry: uv run --extra dev check-json
        language: system
        types: [json]
        stages: [pre-commit]
      - id: check-ast # Check whether files parse as valid python.
        name: check python ast
        entry: uv run --extra dev check-ast
        language: system
        types: [python]
        stages: [pre-commit]
      - id: debug-statements # Check for debugger imports and breakpoint() in python files.
        name: debug statements (python)
        entry: uv run --extra dev debug-statement-hook
        language: system
        types: [python]
        stages: [pre-commit]
      - id: detect-private-key
        name: detect private key
        entry: uv run --extra dev detect-private-key
        language: system
        types: [text]
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        name: check that scripts with shebangs are executable
        entry: uv run --extra dev check-shebang-scripts-are-executable
        language: system
        types: [text]
        stages: [pre-commit]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run --extra dev check-added-large-files
        language: system
        stages: [pre-commit]
      - id: check-case-conflict # Check filenames for conflicts in case-insensitive filesystem: macOS HFS+, Windows FAT
        name: check for case conflicts
        entry: uv run --extra dev check-case-conflict
        language: system
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: text-hygiene
        name: reject control characters, mojibake and curly quotes
        language: system
        entry: uv run python scripts/check_text_hygiene.py
        stages: [pre-commit]
        files: "\\.(py|md|toml|ya?ml|json|txt|lock)$"
      - id: prettier
        name: prettier (Markdown, YAML, JSON)
        language: system
        entry: node node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        files: "\\.(md|ya?ml|json)$"
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --extra dev ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
        stages: [pre-commit]
  # Security.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [pre-commit]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run --extra dev bandit
        language: system
        args: ["-c", "pyproject.toml"]
        types: [python]
        require_serial: true
        stages: [pre-commit]
      - id: commitizen
        name: commitizen check
        entry: uv run --extra dev cz check
        language: system
        args: [--allow-abort, --commit-msg-file]
        stages: [commit-msg]
  # Complexity/quality.
  - repo: local
    hooks:
      - id: vulture
        name: vulture
        # Default confidence (60) kept deliberately: two real runs
        # produced zero false positives at this threshold, no evidence
        # raising it would help.
        # Scans every Python file git does not ignore, through
        # scripts/run_on_git_python_files.py. The manual-tests directory is deliberately excluded: every fixture's
        # entry point is invoked externally by the pyrigor CLI, never
        # referenced in-corpus, so vulture flags it as unused by
        # design. See DECISIONS.md.
        entry: uv run --extra dev python scripts/run_on_git_python_files.py vulture
        language: system
        args: ["--exclude", "manual-tests"]
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
      - id: codespell
        name: codespell
        entry: uv run --extra dev codespell
        language: system
        types: [text]
        stages: [pre-commit]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: complexipy
        name: complexipy
        entry: uv run --extra dev python scripts/run_complexipy.py
        language: system
        # 6 reflects this project's own real, measured maximum
        # complexity ('walk_once', the single hardest case, exempted
        # inline via `# complexipy: ignore`). If a new function
        # exceeds this, prefer a refactoring, or a scoped, justified
        # inline ignore statement over raising this number globally.
        args: ["--max-complexity-allowed", "6", "--failed"]
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
  # Project-specific.
  - repo: https://github.com/jarl-hoyem/pyrigor
    # The published self-hosted hook intentionally lags until the next release
    # is completed. That lag is accepted, so the pinned hook always references
    # an existing released tag. Update this pin after each release.
    rev: v0.12.0
    hooks:
      - id: pyrigor
        # Excludes only the fixtures that deliberately contain real,
        # unsuppressed violations by design (see each manual-tests
        # subfolder's own README.md).
        # clean.py/empty.py/suppressed.py stay covered by this
        # self-check like any other source file.
        # The anchor below is aliased by the WIP self-check hook further
        # down, so this list is written once.
        args: &fixture_excludes
          - --exclude
          - manual-tests/cli/violations.py
          - --exclude
          - manual-tests/cli/unicode.py
          - --exclude
          - manual-tests/cli/nested
          - --exclude
          - manual-tests/pycharm/watcher.py
        stages: [pre-commit]
  # Every Python tool runs from the uv dev environment, so its version
  # lives only in pyproject.toml and uv.lock. Only tools that are not
  # Python packages keep a rev: pin, plus pyrigor's own published hook.
  # Most of the hooks below force a whole-project scan (`pass filenames:
  # false`, usually through scripts/run_on_git_python_files.py) because each needs
  # cross-file or whole-program context to be correct — see
  # DECISIONS.md's "Pre-commit hooks scope to changed files unless a
  # tool genuinely needs whole-project context" for the full policy
  # and per-tool reasoning. `pylint` below is the one deliberate
  # exception in this block, still changed-files-only.
  - repo: local
    hooks:
      # Type/correctness checkers, fastest first.
      # The ty checker respects .gitignore by default, and mypy reads
      # exclude_gitignore from pyproject.toml, so neither needs the wrapper.
      - id: ty
        name: ty
        language: system
        entry: uv run --extra dev ty
        args:
          - check
          - .
        pass_filenames: false
        stages: [pre-commit]
      - id: mypy
        name: mypy
        language: system
        entry: uv run --extra dev mypy
        args:
          - .
        pass_filenames: false
        stages: [pre-commit]
      - id: pyright
        name: pyright
        language: system
        entry: uv run --extra dev python scripts/run_on_git_python_files.py pyright
        args:
          - --project=pyproject.toml
        pass_filenames: false
        stages: [pre-commit]
      - id: pylint
        name: pylint
        language: system
        entry: uv run --extra dev pylint
        types: [python]
        # Changed-files-only, unlike its neighbours above
        # — pylint checks one file at a time. Its findings never
        # depend on another file. See DECISIONS.md.
        stages: [pre-commit]
      # More complexity/quality, fastest first.
      - id: radon-maintainability
        name: radon maintainability
        # The radon tool never fails on the maintainability index, so
        # scripts/check_maintainability.py fails on any rank below A. Each
        # '--allow' entry is a module waiting to be split under #268. The check
        # fails once an entry is no longer needed.
        entry: uv run --extra dev python scripts/run_on_git_python_files.py python scripts/check_maintainability.py
        language: system
        types: [python]
        args:
          - --allow=tests/checkers/test_cli.py
          - --allow=tests/checkers/test_pyr406_return_values_used.py
        pass_filenames: false
        stages: [pre-commit]
      - id: xenon-shared
        name: xenon (relaxed to B, for files with a documented exception)
        language: system
        entry: uv run --extra dev xenon
        pass_filenames: false
        types: [python]
        # Each file listed here needs its own DECISIONS.md-documented
        # reason, the same way _shared.py's walk_once does
        # (single-pass node classification is the point — the same
        # reason it already carries a `# complexipy: ignore`). The tool xenon
        # has no per-function suppression, so relaxing the threshold
        # is scoped to specific files via a second invocation, not a
        # global threshold change.
        args:
          - --max-absolute=B
          - --max-modules=A
          - --max-average=A
          - pyrigor/checkers/_shared.py
          # Add a new file's own path here, and its matching
          # path glob to the strict hook's --exclude above.
        stages: [pre-commit]
      - id: xenon
        name: xenon
        language: system
        entry: uv run --extra dev python scripts/run_on_git_python_files.py xenon
        pass_filenames: false
        types: [python]
        # Files relaxed to level B below are excluded here, one glob
        # per comma-separated entry. Adding a new relaxed file means
        # extending this list and xenon-shared's own path list below
        # — not redesigning the mechanism.
        args:
          - --max-absolute=A
          - --max-modules=A
          - --max-average=A
          - --exclude=*pyrigor/checkers/_shared.py
        stages: [pre-commit]
      - id: tach
        name: tach (module-boundary enforcement)
        entry: uv run --extra dev tach check
        language: system
        files: (\.py$|tach\.toml$)
        pass_filenames: false
        stages: [pre-commit]
      # Project-specific.
      - id: uv-lock-check
        name: uv lock check
        language: python
        entry: uv lock --check
        pass_filenames: false
        stages: [pre-commit]
      - id: dod-check
        name: DoD - warn on likely missed doc/changelog updates
        language: system
        entry: uv run --extra dev python scripts/check_definition_of_done.py
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: generate-rule-table
        name: regenerate guidelines/RULES.md from the real guideline docs
        language: system
        entry: uv run --extra dev python scripts/generate_rule_table.py
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pyrigor
        name: pyrigor (WIP self-check, uncommitted code)
        language: system
        entry: uv run --extra dev python -m pyrigor.checkers.cli .
        args: *fixture_excludes
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
      # Fast local dependency audit runs before the slower test suite.
      - id: pip-audit
        name: pip-audit (fast, local environment)
        language: system
        entry: uv run --extra dev pip-audit --local
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Tests.
      - id: pytest
        name: pytest
        # The suite must include the deliberate test matrix required by
        # DEFINITION_OF_DONE.md. Passing tests cannot prove untested paths.
        language: system
        entry: uv run --extra dev pytest
        pass_filenames: false
        stages: [pre-commit]
      # Precise locked dependency audit is CI only and intentionally slow. It no
      # longer runs on local `git push`; the `pre-push` stage itself stays
      # available for future local hooks (see #235).
      - id: pip-audit-locked
        name: pip-audit (precise, exact uv.lock versions, CI only)
        language: system
        entry: uv run --extra dev python scripts/run_pip_audit.py
        pass_filenames: false
        always_run: true
        stages: [manual]
