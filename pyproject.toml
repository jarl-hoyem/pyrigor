[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrigor"
version = "0.11.0"
description = "A Python coding discipline guideline collection and (eventually) linter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Jarl Hoyem (@jarl-hoyem)" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
pyrigor = "pyrigor.checkers.cli:run"

[project.optional-dependencies]
dev = [
  "setuptools>=68",
  "wheel",
  "pip",
  "pytest>=9.1.1",
  "pytest-cov>=6.3.0",
  "jsonschema>=4.23.0",
  "types-jsonschema>=4.24.0",
  "mypy>=2.3.0",
  "pyright>=1.1.411",
  "ty>=0.0.71",
  "ruff>=0.16.3",
  "radon==6.0.1",
  "mutmut>=3.4.0",
  "pylint>=4.0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrigor*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # Ruff Format remains authoritative for trailing commas. Avoids the formatter-conflict warning.
  "EM101", # descriptive f-strings directly in exceptions is this project's own established style
  "EM102", # same reasoning as EM101, an inline f-string in a raise is fine here, not a custom-exception project
  "TRY003", # long messages passed directly to builtin exceptions, no custom exception hierarchy adopted
  "D203", # conflicts with D211 (no blank line before class wins)
  "D213", # conflicts with D212 (first line summary wins)
  "D413", # conflicts with Google docstring convention (no blank line after last section)
  "CPY001", # no copyright-header convention adopted by this project
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # Assert is pytest's idiom, literal comparisons test's job, not a magic value
"tests/*.py" = ["INP001"]  # bare tests/ directory has no __init__.py by design, pytest discovers it directly
"manual-tests/**/*.py" = ["INP001"]  # standalone manual fixtures, not an importable package
"scripts/**" = ["T201", "INP001"]  # Print is these dev-tooling scripts' output. Standalone scripts, not a package.
"pyrigor/checkers/cli.py" = ["T201"]  # print is the CLI's own real output mechanism
"pyrigor/suppression.py" = ["T201"]  # print is this module's own real stderr-warning mechanism

[tool.bandit]

[tool.bandit.assert_used]
skips = ["*tests/*"]

[tool.codespell]
# astroid: a real Python library name (pylint's inference engine), not a typo for "asteroid"
ignore-words-list = "astroid"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pylint.main]
fail-on = ["I"]
load-plugins = [
  "pylint.extensions.magic_value",
  "pylint.extensions.mccabe",
  "pylint.extensions.docparams",
  "pylint.extensions.docstyle",
  "pylint.extensions.bad_builtin",
  "pylint.extensions.broad_try_clause",
  "pylint.extensions.check_elif",
  "pylint.extensions.code_style",
  "pylint.extensions.comparison_placement",
  "pylint.extensions.confusing_elif",
  "pylint.extensions.consider_refactoring_into_while_condition",
  "pylint.extensions.consider_ternary_expression",
  "pylint.extensions.dict_init_mutate",
  "pylint.extensions.dunder",
  "pylint.extensions.eq_without_hash",
  "pylint.extensions.empty_comment",
  "pylint.extensions.for_any_all",
  "pylint.extensions.no_self_use",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.private_import",
  "pylint.extensions.redefined_loop_name",
  "pylint.extensions.redefined_variable_type",
  "pylint.extensions.set_membership",
  "pylint.extensions.typing",
  "pylint.extensions.while_used",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
enable = [
  "bad-inline-option",
  "deprecated-pragma",
  "file-ignored",
  "use-symbolic-message-instead",
  "useless-suppression",
]
disable = ["consider-using-assignment-expr"]

[tool.coverage.run]
source = ["pyrigor"]

[tool.mutmut]
source_paths = "pyrigor/"

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = [
  "-m", "not slow",
  "--cov=pyrigor",
  "--cov-branch",
  "--cov-report=html",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
  "--strict-markers",
  "-W", "error",
]
