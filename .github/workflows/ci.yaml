# This workflow runs the same checks as .pre-commit-config.yaml, via pre-commit itself.
# Hence CI and local pre-commit can never drift apart.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python package
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install project + pre-commit
        run: |
          uv sync
          uv pip install pre-commit

      - name: Run pre-commit (default-stage hooks)
        env:
          # pip-audit currently fails during import on Python 3.15 because
          # its dependency stack still imports the removed `imp` module.
          SKIP: ${{ matrix.python-version == '3.15' && 'pip-audit' || '' }}
        run: uv run pre-commit run --all-files

      - name: Run pre-commit (pre-push-stage hooks)
        env:
          # The locked audit uses the same pip-audit stack and is likewise
          # incompatible with the Python 3.15 prerelease environment.
          SKIP: ${{ matrix.python-version == '3.15' && 'pip-audit-locked' || '' }}
        run: uv run pre-commit run --all-files --hook-stage pre-push
  stdlib-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project
        run: uv sync --extra dev
      - name: Run pyrigor against the stdlib, must not crash
        run: |
          set +e
          uv run pyrigor "$(python -c "import sysconfig; print(sysconfig.get_path('stdlib'))")"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 2 ]; then exit 1; fi
  artifact-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: uv sync --extra dev
      - name: Build and smoke-test release artifacts
        run: uv run python scripts/smoke_test_artifacts.py

  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mutmut Docker image
        run: docker build -t pyrigor-mutmut -f docker/mutmut.Dockerfile docker/

      - name: Run mutation testing in Docker
        run: |
          docker run --rm \
            --mount type=bind,source="$(pwd)",target=/project \
            pyrigor-mutmut run

      - name: Clean up mutants directory
        if: always()
        run: rm -rf mutants/
