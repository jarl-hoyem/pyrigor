interfaces = []
exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/tests",
    "**/venv",
]
source_roots = [
    ".",
]

[[modules ]]
path = "pyrigor.violations"
depends_on = ["pyrigor.rules"]

[[modules ]]
path = "tests"
depends_on = []

[[modules ]]
path = "pyrigor.checkers.cli"
depends_on = ["pyrigor.checkers._shared", "pyrigor.rules", "pyrigor.violations", "pyrigor.suppression"]

[[modules ]]
path = "pyrigor.rules"
depends_on = []

[[modules ]]
path = "pyrigor.checkers.pyr402_keyword_only_arguments"
depends_on = ["pyrigor.violations", "pyrigor.rules", "pyrigor.checkers._shared"]

[[modules ]]
path = "scripts"
depends_on = []

[[modules ]]
path = "pyrigor.suppression"
depends_on = ["pyrigor.violations"]

[[modules ]]
path = "pyrigor.checkers.pyr401_namedtuple_returns"
depends_on = ["pyrigor.checkers._shared", "pyrigor.rules", "pyrigor.violations"]

[[modules ]]
path = "pyrigor.checkers.pyr406_return_values_used"
depends_on = ["pyrigor.violations", "pyrigor.checkers._shared", "pyrigor.rules"]

[[modules ]]
path = "pyrigor.checkers._shared"
depends_on = ["pyrigor.rules", "pyrigor.violations"]

[[modules ]]
path = "pyrigor.checkers.pyr301_namedtuple_values"
depends_on = ["pyrigor.violations", "pyrigor.rules", "pyrigor.checkers._shared"]

[[modules ]]
path = "pyrigor.checkers.pyr405_namedtuple_parameters"
depends_on = ["pyrigor.checkers._shared", "pyrigor.rules", "pyrigor.violations"]

[[modules ]]
path = "pyrigor.checkers.pyr403_keyword_only_single_argument"
depends_on = ["pyrigor.checkers._shared", "pyrigor.violations", "pyrigor.rules"]
