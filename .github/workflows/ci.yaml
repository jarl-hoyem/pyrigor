# This workflow runs the same checks as .pre-commit-config.yaml, via pre-commit itself.
# Hence CI and local pre-commit can never drift apart.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python package
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Prettier from package-lock.json
        run: npm ci

      - name: Install just
        uses: taiki-e/install-action@b6a061addd82b81aaeca51bdf2c53cd707996e5a # just

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install project + pre-commit
        run: |
          uv sync
          uv pip install pre-commit

      - name: Run quality checks (pre-commit stage)
        env:
          # pip-audit currently fails during import on Python 3.15 because
          # its dependency stack still imports the removed `imp` module.
          SKIP: ${{ matrix.python-version == '3.15' && 'pip-audit' || '' }}
        run: just check

      - name: Run quality checks (pre-push stage)
        env:
          # Windows fixtures must share the checkout's drive to have relative diagnostic paths.
          PYTEST_ADDOPTS: '--basetemp="${{ runner.temp }}/pytest"'
          # pip-audit currently fails during import on Python 3.15 because
          # its dependency stack still imports the removed `imp` module.
          SKIP: ${{ matrix.python-version == '3.15' && 'pip-audit' || '' }}
        run: just check pre-push

      - name: "Run quality checks (manual stage: pip-audit-locked)"
        env:
          # The locked audit uses the same pip-audit stack and is likewise
          # incompatible with the Python 3.15 prerelease environment.
          SKIP: ${{ matrix.python-version == '3.15' && 'pip-audit-locked' || '' }}
        run: just check manual
  stdlib-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install project
        run: uv sync --extra dev
      - name: Run pyrigor against the stdlib, must not crash
        run: |
          set +e
          uv run pyrigor "$(python -c "import sysconfig; print(sysconfig.get_path('stdlib'))")"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 2 ]; then exit 1; fi
  artifact-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: uv sync --extra dev
      - name: Build and smoke-test release artifacts
        run: uv run python scripts/smoke_test_artifacts.py

  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build mutmut Docker image
        run: docker build -t pyrigor-mutmut -f docker/mutmut.Dockerfile .

      - name: Run mutation testing in Docker
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$(pwd)",target=/project \
            pyrigor-mutmut run

      - name: Report surviving mutants
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$(pwd)",target=/project \
            pyrigor-mutmut results

      - name: Enforce mutation score
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$(pwd)",target=/project \
            pyrigor-mutmut export-cicd-stats
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$(pwd)",target=/project \
            --entrypoint python pyrigor-mutmut scripts/check_mutation_score.py

      - name: Clean up mutants directory
        if: always()
        run: sudo rm -rf mutants/
