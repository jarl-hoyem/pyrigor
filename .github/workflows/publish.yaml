# This workflow uploads a Python Package to PyPI when a release is created.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# This workflow uses actions not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Upload Python Package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Build release distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/
  large-repo-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - release-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Clone a large external repo
        run: git clone --depth 1 https://github.com/home-assistant/core.git /tmp/core
      - name: Install project
        run: uv sync --extra dev
      - name: Run pyrigor against it, must not crash
        run: |
          set +e
          uv run pyrigor /tmp/core
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 2 ]; then exit 1; fi
  pypi-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - release-build
      - large-repo-smoke-test
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/pyrigor/${{ github.event.release.tag_name }}
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
