name: "[TEMP] Cache experiment for #292"
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Pre-commit cache variant to test"
        required: true
        type: choice
        options:
          - current
          - none
          - narrow
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Prettier from package-lock.json
        run: npm ci

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments (current)
        if: inputs.variant == 'current'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-3.13-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-3.13-

      - name: Cache pre-commit environments (narrow, exact key only, no fallback)
        if: inputs.variant == 'narrow'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-narrow-${{ runner.os }}-3.13-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install project + pre-commit
        run: |
          uv sync
          uv pip install pre-commit

      - name: Run quality checks (pre-commit stage)
        run: |
          git add --intent-to-add .
          uv run pre-commit run --all-files --hook-stage pre-commit
