name: Update pre-commit hooks
on:
  schedule:
    - cron: "0 6 1 * *" # First of each month, 06:00 in London.
  workflow_dispatch:

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install project + pre-commit
        run: |
          uv sync
          uv pip install pre-commit

      - name: Run autoupdate
        run: uv run pre-commit autoupdate

      - name: Open PR if anything changed
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PYRIGOR_AUTOMERGE_PAT }}
          commit-message: "chore: autoupdate pre-commit hooks"
          title: "chore: autoupdate pre-commit hooks"
          branch: pre-commit-autoupdate
          delete-branch: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.PYRIGOR_AUTOMERGE_PAT }}
