#file: noinspection YAMLSchemaValidation
# Keeping repository quality high.
default_install_hook_types: [ pre-commit, commit-msg ]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements  # Check for debugger imports and breakpoint() in python files.
      - id: check-ast  # Check whether files parse as valid python.
      - id: fix-byte-order-marker  # Removes UTF-8 byte order marker.
      - id: check-json
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict  # Check filenames for conflicts in case-insensitive filesystem: macOS HFS+, Windows FAT
      - id: end-of-file-fixer  # Makes sure files end in a newline and only a newline.
      - id: trailing-whitespace
      - id: mixed-line-ending
  - repo: https://github.com/pycqa/pylint
    rev: v4.0.2
    hooks:
      - id: pylint
        additional_dependencies: [ ]  # add pyrigor's runtime deps here as they're introduced
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [ commit-msg ]
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        entry: uv run --extra dev pyright
        args:
          - --project=pyproject.toml
        pass_filenames: false
      - id: ty
        name: ty
        language: system
        entry: uv run --extra dev ty
        args:
          - check
          - .
        pass_filenames: false
      - id: mypy
        name: mypy
        language: system
        entry: uv run --extra dev mypy
        args:
          - .
        pass_filenames: false
      - id: xenon
        name: xenon
        language: python
        entry: xenon
        pass_filenames: false
        types: [ python ]
        additional_dependencies: [ "xenon==0.9.3" ]
        args:
          - --max-absolute=A
          - --max-modules=A
          - --max-average=A
          - pyrigor/
      - id: radon-maintainability
        name: radon maintainability
        entry: radon mi
        language: python
        types: [ python ]
        args: [ "--min", "A", "--exclude", "tests/", "pyrigor" ]
        additional_dependencies: [ "radon==6.0.1" ]
        pass_filenames: false
      - id: uv-lock-check
        name: uv lock check
        language: python
        entry: uv lock --check
        pass_filenames: false
      - id: pytest
        name: pytest
        language: system
        entry: uv run --extra dev pytest
        pass_filenames: false
      # Saved for later: stages: [pre-push] # Only run on push instead of every commit.
